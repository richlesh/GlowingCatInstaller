name: CI

on:
  push:
    branches: [main, master]
  pull_request: {}
  workflow_dispatch: {}

# Debounce: a newer run on the same ref cancels an in-progress one (including
# while it is still in the 10-minute quiet delay), so only the latest commit is
# built.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quiet period: wait 10 minutes before building/testing. This debounces
  # rapid consecutive pushes (combined with the concurrency group below, a newer
  # push cancels an in-progress delay so only the latest commit is built).
  delay:
    name: Quiet delay (10m)
    runs-on: ubuntu-24.04
    steps:
      - name: Wait 10 minutes
        run: sleep 600

  build-test:
    name: Build & Test (${{ matrix.os }})
    needs: delay
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libfontconfig-dev libfreetype-dev \
            libxcb1-dev libxkbcommon-dev \
            libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all
