name: Build Installers

# Builds the Glowing Cat Software Installer itself for every platform/architecture and
# uploads the installer artifacts. Manual-only: run it from the Actions tab
# (workflow_dispatch). Optionally publish a GitHub Release from the same run by
# setting `publish_release: true` and providing a `tag`.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Also publish a GitHub Release with the built artifacts"
        type: boolean
        default: false
      tag:
        description: "Release tag / version (e.g. v0.1.0). Stamped into Cargo.toml and all artifact filenames (build-only). Required when publish_release is true."
        type: string
        default: ""

permissions:
  contents: write
  # Required by azure/login (OIDC federated credentials) for Windows signing.
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # Linux: .deb and .rpm, for x64 and arm64, built on native-arch runners.
  # ---------------------------------------------------------------------------
  linux:
    name: Linux ${{ matrix.pkg }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   runner: ubuntu-24.04,      target: x86_64-unknown-linux-gnu,  pkg: deb }
          - { arch: x64,   runner: ubuntu-24.04,      target: x86_64-unknown-linux-gnu,  pkg: rpm }
          - { arch: arm64, runner: ubuntu-24.04-arm,  target: aarch64-unknown-linux-gnu, pkg: deb }
          - { arch: arm64, runner: ubuntu-24.04-arm,  target: aarch64-unknown-linux-gnu, pkg: rpm }
    steps:
      - uses: actions/checkout@v4

      # Derive the version from the `tag` input (strip a leading "v"); fall back
      # to the version already in Cargo.toml when no tag was supplied. Patch it
      # into Cargo.toml build-only (not committed) so every packaging tool and
      # artifact filename carries this version.
      - name: Derive version and patch Cargo.toml
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ]; then
            VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          sed -i -E "0,/^version\s*=\s*\"[^\"]+\"/s//version = \"${VERSION}\"/" Cargo.toml
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"
          grep -m1 '^version' Cargo.toml

      - name: Install system dependencies (Slint runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libfontconfig-dev libfreetype-dev \
            libxcb1-dev libxkbcommon-dev \
            libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Build against an older glibc floor (2.35) so the binaries run on
      # Debian 12 (glibc 2.36), Ubuntu 22.04 (2.35) and newer — not just the
      # 24.04 runner's glibc (2.39). cargo-zigbuild uses Zig as the linker and
      # lets us pin the glibc version in the target triple; the output still
      # lands in target/<triple>/release so the packaging steps are unchanged.
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build (release, glibc 2.35 floor)
        run: cargo zigbuild --release --target ${{ matrix.target }}.2.35

      # cargo-deb / cargo-generate-rpm read [package.metadata.*] in Cargo.toml.
      - name: Install packaging tool
        run: |
          if [ "${{ matrix.pkg }}" = "deb" ]; then
            cargo install cargo-deb --locked
          else
            cargo install cargo-generate-rpm --locked
          fi

      - name: Package .deb
        if: matrix.pkg == 'deb'
        run: |
          cargo deb --no-build --target ${{ matrix.target }} --output dist/
          mkdir -p out && cp dist/*.deb out/

      - name: Package .rpm
        if: matrix.pkg == 'rpm'
        run: |
          mkdir -p out
          cargo generate-rpm --target ${{ matrix.target }} \
            --payload-compress none \
            -o out/glowing-cat-installer-${{ steps.ver.outputs.version }}-${{ matrix.arch }}.rpm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.pkg }}-${{ matrix.arch }}
          path: out/*

  # ---------------------------------------------------------------------------
  # macOS: .dmg for x64 and arm64. macos-14 is arm64; we cross-build x86_64.
  # ---------------------------------------------------------------------------
  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-14
    # Expose the macOS signing secret as env so the step `if:` conditions can
    # detect whether signing is configured. When it is unset, the import /
    # notarize steps are skipped and an unsigned .dmg is produced.
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, target: aarch64-apple-darwin }
          - { arch: x64,   target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4

      # Derive version from the `tag` input (strip leading "v"); fall back to the
      # Cargo.toml version. Patched build-only so Info.plist + .dmg filename match.
      - name: Derive version and patch Cargo.toml
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ]; then
            VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          perl -0pi -e "s/^version\s*=\s*\"[^\"]+\"/version = \"${VERSION}\"/m" Cargo.toml
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      # Import the Developer ID Application certificate into a temporary
      # keychain so the bundle step can codesign the .app and .dmg. Skipped
      # automatically when the signing secret isn't configured (unsigned build).
      - name: Import Developer ID certificate (macOS)
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=build-keychain-password
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # Build the .app + .dmg. When the keychain holds a Developer ID identity,
      # the bundle script codesigns the app with hardened runtime + timestamp +
      # entitlements; otherwise it produces an unsigned bundle.
      - name: Bundle .app and .dmg
        env:
          GCI_SIGN_IDENTITY_NAME: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          GCI_KEYCHAIN: ${{ runner.temp }}/build.keychain
        run: |
          chmod +x packaging/macos-bundle.sh
          packaging/macos-bundle.sh ${{ matrix.target }} ${{ matrix.arch }}

      # Sign the DMG itself, submit it for notarization, and staple the ticket
      # so the download runs on Gatekeeper without a network check. Skipped when
      # the signing secret isn't configured (unsigned build).
      - name: Sign DMG + notarize + staple (macOS)
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          # Accept either a bare name or a full "Developer ID Application: ..."
          # value in the secret; normalise to the full identity string.
          NAME="${APPLE_SIGNING_IDENTITY#Developer ID Application: }"
          IDENTITY="Developer ID Application: ${NAME}"
          DMG="dist/GlowingCatInstaller-${{ steps.ver.outputs.version }}-${{ matrix.arch }}.dmg"

          # Sign the disk image itself.
          codesign --force --timestamp --sign "$IDENTITY" \
            --keychain "$KEYCHAIN_PATH" "$DMG"

          # Notarize using an App Store Connect API key.
          KEY_FILE=$RUNNER_TEMP/AuthKey.p8
          echo "$APPLE_API_KEY" > "$KEY_FILE"
          xcrun notarytool submit "$DMG" \
            --key "$KEY_FILE" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait | tee notarize_output.txt

          # Surface the log and fail the job if notarization was rejected.
          if grep -q "Invalid\|Rejected" notarize_output.txt; then
            SUBMISSION_ID=$(grep -m1 "id:" notarize_output.txt | awk '{print $2}')
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$KEY_FILE" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" || true
            exit 1
          fi

          # Staple the ticket into the DMG.
          xcrun stapler staple "$DMG"
          rm -f "$KEY_FILE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: dist/*.dmg

  # ---------------------------------------------------------------------------
  # Windows: Setup .exe for x64 and arm64, built with Inno Setup.
  # windows-latest is x64; we add the arm64 target and cross-build the binary,
  # then wrap each in an installer .exe.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    # Expose the Azure signing identity as env so the step `if:` conditions can
    # detect whether Trusted Signing is configured. When unset, the login /
    # sign steps are skipped and an unsigned Setup.exe is produced.
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   target: x86_64-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      # Derive version from the `tag` input (strip leading "v"); fall back to the
      # Cargo.toml version. Patched build-only so the embedded AppVersion and the
      # Setup.exe filename carry this version.
      - name: Derive version and patch Cargo.toml
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          $version = $tag -replace '^v',''
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          }
          $content = Get-Content Cargo.toml -Raw
          $content = [regex]::Replace($content, '(?m)^version\s*=\s*"[^"]+"', "version = `"$version`"", 1)
          Set-Content -Path Cargo.toml -Value $content -NoNewline
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Setup .exe (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:GITHUB_WORKSPACE "out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # Pass absolute paths so Inno's resolution never depends on the
          # script dir vs. the working dir.
          & "$iscc" `
            "/DAppVersion=${{ steps.ver.outputs.version }}" `
            "/DSourceExe=$env:GITHUB_WORKSPACE\target\${{ matrix.target }}\release\glowing-cat-installer.exe" `
            "/DIconsDir=$env:GITHUB_WORKSPACE\resources\icons" `
            "/DOutputDir=$out" `
            "/DArchLabel=${{ matrix.arch }}" `
            "/DArch=${{ matrix.arch }}" `
            "$env:GITHUB_WORKSPACE\packaging\installer.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC failed with exit code $LASTEXITCODE"
          }
          # Fail loudly here (not later in the signer) if no installer was made.
          Write-Host "Contents of ${out}:"
          Get-ChildItem $out -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" }
          $exe = Get-ChildItem $out -Filter *.exe -ErrorAction SilentlyContinue
          if (-not $exe) {
            throw "No Setup .exe was produced in $out"
          }

      # Sign the finished installer with Azure Trusted Signing. Skipped when
      # Azure isn't configured (unsigned build).
      - name: Azure login (Windows)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign installer (Windows)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v0.5.1
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}/out
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-${{ matrix.arch }}
          path: ${{ github.workspace }}/out/*.exe

  # ---------------------------------------------------------------------------
  # Optionally attach everything to a GitHub Release. Runs only when the manual
  # dispatch requested it (publish_release: true) and a tag was supplied.
  # ---------------------------------------------------------------------------
  release:
    name: Publish Release
    needs: [linux, macos, windows]
    if: ${{ inputs.publish_release && inputs.tag != '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Create the release tag at the checked-out commit if it doesn't already
      # exist (locally or on origin), then push it. Existing tags are left as-is.
      - name: Create and push tag if missing
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin; not recreating."
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists locally; pushing it."
            git push origin "refs/tags/$TAG"
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
            echo "Created and pushed tag $TAG."
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.exe' \) \
            -exec cp {} release/ \;
          ls -la release

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: release/*
          generate_release_notes: true
